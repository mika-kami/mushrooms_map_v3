name: Lint, Build, and Deploy to AWS Lambda

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

# Define environment variables that will be used across the jobs
env:
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  AWS_REGION: 'eu-north-1'
  ECR_REPOSITORY: 'mushrooms-map'
  LAMBDA_FUNCTION_NAME: 'mushroomsMapDocker'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies for linting
      run: |
        python -m pip install --upgrade pip
        pip install black

    - name: Run black code formatter check
      run: black --check .

  deploy:
    # This job depends on the successful completion of the 'lint' job
    needs: lint
    # Only run on pushes to the master branch, not on pull requests
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Log in to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Build, tag, and push image to Amazon ECR
      id: build-image
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: ${{ github.sha }} # Use the commit hash as a unique image tag
      run: |
        # Build the docker image and tag it
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
        # Push the image to ECR
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
        # Set the image URI as an output for the next step
        echo "image_uri=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

    - name: Update Lambda function with new image
      run: |
        aws lambda update-function-code \
          --function-name ${{ env.LAMBDA_FUNCTION_NAME }} \
          --image-uri ${{ steps.build-image.outputs.image_uri }}

    - name: Wait for Lambda function update to complete
      run: |
        aws lambda wait function-updated \
          --function-name ${{ env.LAMBDA_FUNCTION_NAME }}

    - name: Create EventBridge Schedule
      run: |
        # Get Lambda function ARN
        LAMBDA_ARN=$(aws lambda get-function \
          --function-name ${{ env.LAMBDA_FUNCTION_NAME }} \
          --query 'Configuration.FunctionArn' \
          --output text)
        
        # Create or update EventBridge rule
        aws events put-rule \
          --name mushroom-map-daily-job \
          --schedule-expression "cron(0 10 * * ? *)" \
          --state ENABLED || true
        
        # Add Lambda as target
        aws events put-targets \
          --rule mushroom-map-daily-job \
          --targets "Id"="1","Arn"="$LAMBDA_ARN" || true
        
        # Add permission
        aws lambda add-permission \
          --function-name ${{ env.LAMBDA_FUNCTION_NAME }} \
          --statement-id mushroom-map-schedule \
          --action lambda:InvokeFunction \
          --principal events.amazonaws.com \
          --source-arn arn:aws:events:${{ env.AWS_REGION }}:$(aws sts get-caller-identity --query Account --output text):rule/mushroom-map-daily-job \
          || true
